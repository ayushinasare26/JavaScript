<!DOCTYPE html>
<html>
<head>
    <title>Billing Calculator</title>
</head>
<body>
<h3>Name: Ayushi Nasare</h3>
<h3>PRN:24070521174</h3>
<h2>Billing Calculator</h2>


<script>

const GST = 0.18;

var customerName = prompt("Enter Customer Name: ");
var productName = prompt("Enter Product Name: ");
var PRN = prompt("Enter PRN: ");

var quantity = Number(prompt("Enter quantity"));
// if (isNaN(quantity) || quantity < 0) quantity = 0;
let price = Number(prompt("Enter price per Item"));
// if (isNaN(price) || price < 0) price = 0;

let total = quantity * price;
let gstAmount = total * GST;
let finalBill = total + gstAmount;

const bill = {
    customer: customerName,
    product: productName,
    prn: prn,
    quantity,
    price,
    total,
    gstAmount,
    finalBill
};
//Destruction
const {
    customer,
    product,
    prn,
    gstAmount: gst,
    finalBill: amount
} = bill;
//Object using Template Literals
document.write(`<h3>Billing Receipt</h3>`);
document.write(`<p>Customer: ${customer}</p>`);
document.write(`<p>Product: ${product}</p>`);
document.write(`<p>PRN: ${prn}</p>`);
document.write(`<p>Quantity: ${quantity}</p>`);
document.write(`<p>Price per Item: ₹${price.toFixed(2)}</p>`);
document.write(`<p>Total: ₹${total.toFixed(2)}</p>`);
document.write(`<p>GST (18%): ₹${gst.toFixed(2)}</p>`);
document.write(`<h3>Final Bill: ₹${amount.toFixed(2)}</h3>`);

</script>

</body>
</html>
